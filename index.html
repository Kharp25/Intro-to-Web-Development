<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
            text-align: center;
        }

        header {
            background: #111827;
            color: white;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 48px;
            margin: 0 0 10px;
        }

        header p {
            font-size: 20px;
        }

        section {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 14px 25px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        footer {
            background: #111827;
            color: white;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>This is my first website!</p>
        <a href="#about" class="button">Learn More</a>
    </header>

    <section id="about">
        <h2>About Me</h2>
        <p>
            Hi! My name is Kaleb. Welcome to my website.
        </p>
    </section>

    <section>
        <h2>Contact</h2>
        <p>Email me at: your@email.com</p>
    </section>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
